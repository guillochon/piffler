[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "piffler"
version = "0.1.0"
description = "Turn a video of someone flipping through a book into clean, dewarped, OCR'd page scans."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "opencv-python-headless>=4.6",
    "rapidocr>=2.0",
    # DirectML runs OCR on any DirectX 12 GPU and falls back to the CPU on its own;
    # elsewhere the stock build (with CoreML on macOS). For NVIDIA GPUs on Linux,
    # swap in onnxruntime-gpu: pip uninstall onnxruntime && pip install onnxruntime-gpu
    "onnxruntime-directml>=1.17; sys_platform == 'win32'",
    "onnxruntime>=1.14; sys_platform != 'win32'",
]

[project.optional-dependencies]
pdf = ["reportlab>=3.6"]
test = ["pytest>=7"]

[project.scripts]
piffler = "piffler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
