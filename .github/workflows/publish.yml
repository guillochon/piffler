name: Publish to PyPI

# Publishing a GitHub release (tag vX.Y.Z matching piffler.__version__) uploads
# the package to PyPI. Running this workflow by hand uploads to TestPyPI instead,
# for a dry run. Both use PyPI Trusted Publishing: no API token is stored here.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/piffler/__init__.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match piffler.__version__ $version"
            exit 1
          fi

      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: upload to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/piffler
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    name: upload to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/piffler
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
